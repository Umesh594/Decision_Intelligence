apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-simulator-backend
  namespace: decision-simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-simulator-backend
  template:
    metadata:
      labels:
        app: decision-simulator-backend
    spec:
      containers:
        - name: backend
          image: decision-simulation-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: decision-simulator-config
            - secretRef:
                name: decision-simulator-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: decision-simulator-backend
  namespace: decision-simulator
spec:
  selector:
    app: decision-simulator-backend
  ports:
    - port: 8080
      targetPort: 8080
